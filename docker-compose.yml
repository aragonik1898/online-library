services:
  library-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/Library.db
    volumes:
      - library-data:/app/data
      - library-uploads:/app/wwwroot/uploads
    networks:
      - library-network

volumes:
  library-data:
  library-uploads:

networks:
  library-network:
    driver: bridge
