name: CI/CD Pipeline Example

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_NAME: 'Library'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build project
      run: dotnet build --no-restore --configuration Release
      
    - name: Run tests (if any)
      run: dotnet test --no-build --configuration Release --verbosity normal || echo "No tests found - this is expected for this example project"
      
    - name: Publish application
      run: dotnet publish --configuration Release --output ./publish
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: ./publish

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Code analysis
      run: |
        echo "Running code analysis..."
        dotnet build --configuration Release --verbosity normal
        echo "Code analysis completed successfully!"

  docker-build-example:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image (example)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false  # Не пушим, только собираем для примера
        tags: library-app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deployment-example:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deployment simulation
      run: |
        echo "=== DEPLOYMENT SIMULATION ==="
        echo "This is an example of how deployment would work:"
        echo "1. Build completed successfully"
        echo "2. Code quality checks passed"
        echo "3. Docker image built"
        echo "4. Ready for deployment to production"
        echo ""
        echo "In a real scenario, you would:"
        echo "- Deploy to Azure App Service"
        echo "- Deploy to AWS Elastic Beanstalk"
        echo "- Deploy to Kubernetes cluster"
        echo "- Deploy to Docker Swarm"
        echo ""
        echo "Deployment simulation completed!"
